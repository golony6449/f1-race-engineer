[project]
name = "f1re"
version = "0.1.0"
description = "F1 25 UDP 텔레메트리 기반 한국어 AI 레이스 엔지니어"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
f1re-demo = "f1re.demo_sender.sender:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
