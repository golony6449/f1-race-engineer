<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>F1 레이스 엔지니어</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!--
      상단 상태줄(설계 6.9-5). 음성·무전 페이지 상태는 서버가 실제 값으로
      내려 준다(음성 온라인/오프라인, 무전 페이지 연결/미연결).
    -->
    <header class="statusbar">
      <section class="status" id="status-connection">
        <span class="status-label">데이터 수신</span>
        <span class="status-value" data-field="connection">연결 중…</span>
        <span class="status-detail" id="connection-detail"></span>
        <span class="status-detail" id="connection-detail-2"></span>
      </section>
      <section class="status" id="status-voice">
        <span class="status-label">음성</span>
        <span class="status-value" data-field="voice">음성 오프라인</span>
        <span class="status-detail">Qwen TTS</span>
      </section>
      <section class="status" id="status-radio-page">
        <span class="status-label">무전 페이지</span>
        <span class="status-value" data-field="radio_page">무전 페이지 미연결</span>
        <span class="status-detail">게임 PC 브라우저 /radio</span>
      </section>
    </header>

    <!--
      차량 상태(설계 6.9-1). 값이 끊기면 마지막 값을 흐리게 유지한다.
      무전 기록·세션 리포트는 작업 20에서 이 화면에 붙는다.
    -->
    <main id="dashboard" class="stale">
      <section class="panel tyres">
        <h2>타이어</h2>
        <div class="tyre-grid" id="tyres">
          <p class="waiting">데이터를 기다리는 중…</p>
        </div>
      </section>

      <!--
        서킷 지도(설계 6.9-2). 윤곽·코너·차 위치는 서버 API가 계산해 준다.
        UI는 map.js가 그리고, 코너를 누르면 최근 지표(나 / 기준)를 보여 준다.
      -->
      <section class="panel map">
        <h2>서킷 지도</h2>
        <div class="map-wrap" id="track-map">
          <canvas id="track-canvas" aria-label="서킷 지도"></canvas>
          <p class="map-waiting">지도 없음 · 첫 유효 랩의 위치를 기다리는 중</p>
          <span class="map-flag" hidden></span>
        </div>
        <div class="map-info" id="map-info"></div>
      </section>

      <section class="panel brakes">
        <h2>브레이크 온도</h2>
        <div class="brake-grid" id="brakes">
          <p class="waiting">데이터를 기다리는 중…</p>
        </div>
      </section>

      <section class="panel fuel">
        <h2>연료</h2>
        <div class="cell-grid" id="fuel">
          <p class="waiting">데이터를 기다리는 중…</p>
        </div>
      </section>

      <section class="panel ers">
        <h2>ERS</h2>
        <div class="cell-grid" id="ers">
          <p class="waiting">데이터를 기다리는 중…</p>
        </div>
      </section>

      <section class="panel damage">
        <h2>손상</h2>
        <div class="damage-grid" id="damage">
          <p class="waiting">데이터를 기다리는 중…</p>
        </div>
      </section>
    </main>

    <script type="module" src="/static/dashboard.js"></script>
  </body>
</html>
