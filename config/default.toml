# F1 25 한국어 레이스 엔지니어 기본 설정.
# 뒤 작업에서 [coaching.thresholds] 같은 섹션이 추가된다.

[global]
# 집중 코너: 최근 랩에서 시간을 가장 많이 잃는 코너 수 (4~5개)
focus_corner_count = 5
# 집중 코너를 산정할 때 보는 최근 랩 수
focus_recent_laps = 3
# 집중 코너가 아니어도 바로 말하는 손실 (초)
big_loss_s = 0.3
# 다음 코너 브레이크 지점까지 이보다 짧으면 다음 긴 직선으로 미룸 (초)
defer_s = 3.0
# 추월 안내를 켜는 앞차와의 간격 (초)
overtake_gap_s = 1.0
# 랩당 추월 무전 횟수
overtake_per_lap = 1
# F1 25 UDP 수신 포트
udp_port = 20777

# 대시보드 웹 서버. 태블릿·옆 모니터가 이 주소로 접속한다(설계 6.9).
# 명령줄 `--web-host`/`--web-port`가 이 값을 덮어쓴다.
[web]
# 모든 인터페이스에서 받는다. 로컬에서만 볼 때는 127.0.0.1로 바꾼다.
host = "0.0.0.0"
port = 8093

# 무전 전달 계층(설계 6.7).
# 안전 경고·박스 지시는 앞 무전이 재생되는 동안 기다려도 만료되지 않도록
# 충분한 유효 시간을 둔다(SCRUM-81). 코칭·추월처럼 시점이 중요한 무전의
# 유효 시간은 각 모듈이 정한다.
[radio]
# 안전 경고 유효 시간(초). 문장 하나가 3초 안팎이므로 여러 무전이 밀려도 남는다.
safety_ttl_s = 30.0
# 박스 지시 유효 시간(초). 안전 경고 뒤에 나가도 되도록 같게 둔다.
box_ttl_s = 30.0

[tts]
# 일반(비실시간) 합성 모델. 국제(싱가포르) 리전
model = "qwen3-tts-flash"
# 실시간 WebSocket 모델. 이번 구현은 qwen3-tts-flash의 SSE 스트리밍을 쓴다.
realtime_model = "qwen3-tts-flash-realtime"
# 보이스. Katerina는 사용자 선택(2026-11-13).
voice = "Katerina"
# 말 속도. 음 높이는 유지하고 서버에서 WSOLA로 시간만 늘인다(1.0이면 그대로).
speed = 1.2
# 요청 전체 타임아웃 (초). 넘으면 TTSUnavailable로 올린다.
timeout_s = 2.0
# 공용 시크릿 모듈(claude_secrets.get)에서 읽을 키 이름
secret_key = "qwen"
# Model Studio 국제 리전 TTS 엔드포인트.
# 시크릿 dict의 base_url(OpenAI 호환 주소일 수 있음)은 쓰지 않고 이 값을 쓴다.
endpoint = "https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
# 발음 언어. 한국어 무전 문장이므로 Korean으로 고정한다.
language_type = "Korean"
# 무전 앞에 붙이는 F1 중계풍 알림음. 저작권 때문에 효과음 파일은 레포에 넣지 않고
# `uv run python tools/fetch_assets.py`로 받아 assets/에 둔다(.gitignore 대상).
intro_sound_url = "https://www.myinstants.com/media/sounds/formula-1-radio-notification.mp3"
# 받아 둔 효과음 위치. 레포 루트 기준 상대 경로.
intro_sound_path = "assets/radio-intro.wav"
# 효과음과 무전 음성 사이 무음 (ms)
intro_gap_ms = 150
# 효과음 크기 배율
intro_gain = 0.8

# ---------------------------------------------------------------------------
# LLM 무전 문장 생성 (SCRUM-129)
#
# 판단과 숫자는 규칙 엔진이 정하고, LLM은 주어진 사실(facts)과 KB 문맥만으로
# 짧은 한국어 무전 문장을 만든다. 급하지 않은 무전(추월·방어 전략 등)에 쓴다.
# 요청이 timeout_s 안에 끝나지 않거나, 입력에 없는 숫자·비한국어 문자가
# 나오면 미리 만든 fallback 문장으로 대체해 무전 큐를 막지 않는다.
# ---------------------------------------------------------------------------
[llm]
enabled = true
# Model Studio 국제 리전의 OpenAI 호환 chat completions 모델·주소
model = "qwen3.7-flash-2026-07-15"
endpoint = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions"
# 요청 전체 타임아웃(초). 넘으면 fallback 문장을 쓴다.
timeout_s = 1.5
# 공용 시크릿 모듈(claude_secrets.get)에서 읽을 키 이름
secret_key = "qwen"
# 무전 한두 문장이면 충분하므로 출력 토큰을 짧게 제한한다.
max_tokens = 80
temperature = 0.3

# ---------------------------------------------------------------------------
# 위험 기준 단일 출처 (설계 6.6)
#
# 대시보드 색과 음성 경고가 이 값 하나를 함께 쓴다. 값이 danger에 닿는 순간
# 화면이 빨간색이 되고, 그 순간이 음성 경고 조건이다. warn은 화면 노란색이며
# 리프트 앤 코스트(SCRUM-71)가 미리 쓰는 여유 기준이기도 하다.
#
# 판정 방식(방향은 지표 의미라 코드에 고정):
# - high(높을수록 위험): value >= danger → DANGER, value >= warn → WARN
# - low(낮을수록 위험):  value <  danger → DANGER, value <  warn → WARN
# 단위: 손상·마모 %, 온도 °C, 연료 여유 랩.
# ---------------------------------------------------------------------------
[thresholds]

# 화면 색. 대시보드는 이 값을 그대로 쓰고 문턱값을 다시 계산하지 않는다.
[thresholds.colors]
ok = "#22c55e"
warn = "#f59e0b"
danger = "#ef4444"
no_data = "#6b7280"

# 앞날개 손상(%). 계획 작업 8이 정한 경고 25 / 위험 50을 그대로 쓴다.
[thresholds.front_wing_damage]
warn = 25.0
danger = 50.0

# 앞날개 좌·우를 따로 표시할 때 쓴다(설계 6.9).
[thresholds.front_left_wing_damage]
warn = 25.0
danger = 50.0

[thresholds.front_right_wing_damage]
warn = 25.0
danger = 50.0

# 뒷날개·바닥·디퓨저·사이드포드: 앞날개와 같은 손상 % 척도를 쓴다.
# 25%부터 공력 손실이 보이고 50%면 큰 손실로 본다.
[thresholds.rear_wing_damage]
warn = 25.0
danger = 50.0

[thresholds.floor_damage]
warn = 25.0
danger = 50.0

[thresholds.diffuser_damage]
warn = 25.0
danger = 50.0

[thresholds.sidepod_damage]
warn = 25.0
danger = 50.0

# 기어박스·엔진 손상(%). 50% 이상이면 페널티·고장 위험이 커진다.
[thresholds.gearbox_damage]
warn = 25.0
danger = 50.0

[thresholds.engine_damage]
warn = 25.0
danger = 50.0

# 파워유닛 부품 마모(%). 시즌 누적 값이라 90% 이상이면 교체가 필요하다.
[thresholds.engine_mguh_wear]
warn = 75.0
danger = 90.0

[thresholds.engine_es_wear]
warn = 75.0
danger = 90.0

[thresholds.engine_ce_wear]
warn = 75.0
danger = 90.0

[thresholds.engine_ice_wear]
warn = 75.0
danger = 90.0

[thresholds.engine_mguk_wear]
warn = 75.0
danger = 90.0

[thresholds.engine_tc_wear]
warn = 75.0
danger = 90.0

# 타이어 마모(%). 50%부터 그립 저하가 뚜렷해지고 75%면 교체가 임박하다.
# 리프트 앤 코스트가 마모를 줄이도록 미리 알리는 기준이 warn이다.
[thresholds.tyre_wear]
warn = 50.0
danger = 75.0

# 타이어 표면 온도(°C). 슬릭 작동대는 약 90~110도이고 120도 이상은
# 블리스터·그레인 위험이 커진다.
[thresholds.tyre_temp]
warn = 110.0
danger = 120.0

# 타이어 내부(카커스) 온도(°C). 표면보다 늦게 오르고 130도 이상이 지속되면
# 구조 손상 위험이 있다.
[thresholds.tyre_inner_temp]
warn = 115.0
danger = 130.0

# 브레이크 온도(°C). 카본 브레이크 작동대는 약 400~1000도이고 1000도를
# 넘으면 마모·페이드 위험이 커진다.
[thresholds.brake_temp]
warn = 850.0
danger = 1000.0

# 엔진 온도(°C). 파워유닛 냉각수·오일 한계가 약 130도다.
[thresholds.engine_temp]
warn = 120.0
danger = 130.0

# 연료 여유 랩(랩). 값은 "남은 연료 랩 - 남은 레이스 랩"이다.
# 설계 6.6대로 0 미만이면 DANGER다(정확히 0이면 아직 부족은 아니므로 WARN).
# 0.5랩 이내로 줄면 리프트 앤 코스트로 연료를 아끼기 시작한다.
[thresholds.fuel_laps_margin]
warn = 0.5
danger = 0.0

# ---------------------------------------------------------------------------
# 코너 코칭 원인 판정 민감도 (SCRUM-124)
#
# 3~6m 차이 같은 사소한 오차로 무의미한 코칭을 하지 않도록 브레이크·턴인
# 지점 차이 문턱을 8m로 올렸다. 정점 최저속도는 4km/h, 스로틀 재개는 8m,
# 조향 수정은 2회, 라인 이탈은 1.5m다. 손실이 min_corner_loss_ms(100ms)보다
# 작은 코너는 원인 문턱을 넘어도 말하지 않는다.
#
# 근거: 2026-11-15 실제 F1 25 레이스 녹화(recording-6.f1rec, 스즈카, 11유효랩)
# 분석. 3m 문턱의 원인 후보 146건 중 60건만 손실 100ms 이상이었고, 8m 문턱과
# 100ms 하한을 함께 쓰면 59건, 접전 코너(62.2%)를 빼면 15건만 남았다. 10m로
# 올리면 의미 있는 후보가 14건으로 줄어, 8m를 골랐다. 정점 속도는 2→4km/h로
# 올려도 손실 100ms 이상 후보 수가 같았다.
# ---------------------------------------------------------------------------
[coaching]
# 브레이크 시작 지점 차이 문턱(m).
brake_diff_m = 8.0
# 턴인 지점 차이 문턱(m).
turn_in_diff_m = 8.0
# 정점(최저) 속도 차이 문턱(km/h).
min_speed_diff_kmh = 4.0
# 스로틀을 다시 밟은 지점 차이 문턱(m).
throttle_diff_m = 8.0
# 조향 수정 횟수 차이 문턱(회).
steer_corrections = 2
# 기준 궤적에서 더 벗어난 거리 문턱(m).
line_dev_m = 1.5
# 이보다 손실이 작은 코너는 코칭하지 않는다(ms). 0.1초.
min_corner_loss_ms = 100

# ---------------------------------------------------------------------------
# 코너 지표 문턱값 (설계 6.2, 작업 15)
#
# 코너 지표(브레이크 시작·턴인·조향 수정·스로틀 재개 등)를 판정하는 값이다.
# 설계 6.2의 예시(브레이크 시작 = 압력 10% 이상)를 출발점으로 두고, 데모 송신기
# 스즈카·모나코 랩으로 확인한 값을 적었다. 실제 게임 녹화(리플레이)로 다시 맞춘다.
# 페달·조향 값은 0~1, 거리는 m다.
# ---------------------------------------------------------------------------
[coaching.thresholds]

# 브레이크를 밟기 시작한 것으로 보는 압력. 설계 6.2 예시의 10%를 쓴다.
brake_on = 0.10
# 브레이크 시작을 찾을 때 코너 진입 앞으로 더 보는 거리.
brake_search_back_m = 150.0
# 브레이크 구간이 코너 진입에서 이 거리 안쪽에 끝나면 그 코너의 브레이크로 본다.
# 앞 코너와 간격이 좁은 시케인(스즈카 16·17번)에서 앞 코너 브레이크를 잘못
# 잡지 않게 하는 값이다.
brake_release_margin_m = 10.0
# 조향을 시작한 것으로 보는 조향 크기(|steer|). 자동 코너 탐지와 같은 수준이다.
steer_on = 0.05
# 턴인을 찾을 때 코너 진입 앞으로 더 보는 거리. 이른 턴인(진입 전 조향)을 잡는다.
steer_search_back_m = 40.0
# 조향 잡음을 지우는 이동 평균 창.
steer_smooth_m = 4.0
# 조향 수정으로 세지 않는 미세한 조향 변화.
steer_correction_deadband = 0.02
# 조향 방향 전환 두 번을 수정 한 번으로 세기 위한 최소 간격.
steer_correction_min_gap_m = 8.0
# 스로틀을 다시 밟은 것으로 보는 입력.
throttle_on = 0.05
# 풀스로틀로 보는 입력.
full_throttle = 0.95
# 기준 궤적 이탈 거리 상한. 이 값을 넘으면 좌표계가 다른 기준 랩(데모 좌표 등)으로
# 보고 라인 판단을 하지 않는다. 2026-11-14 실제 세션에서 기준 랩과 같은 랩 거리의
# 차 위치가 110~1157 m 떨어져 나왔다(SCRUM-93).
line_dev_max_m = 50.0
# 기준 궤적에서 가장 가까운 선분을 찾을 때 보는 랩 거리 창.
line_dev_search_m = 40.0

# ---------------------------------------------------------------------------
# 세션별 원시 텔레메트리 자동 녹화 (설계 4.3)
#
# Engine ON 동안 들어오는 실제 게임 세션을 sessionUID별로 `.active/`에 순차
# 기록하고, 세션이 끝나면 압축(`.f1rec.zst`)해 GCS에 백업한다. 60Hz 수신
# 루프는 비압축 쓰기만 하므로 녹화 때문에 패킷이 밀리지 않는다.
#
# GCS 업로드가 확인되지 않은 로컬 파일은 지우지 않는다. rclone이 없거나
# 설정이 잘못돼 업로드를 못 하면 경고만 남기고 녹화·로컬 보존은 계속한다.
# ---------------------------------------------------------------------------
[recording]
enabled = true
# 녹화 파일 기준 디렉터리(레포 루트 기준 상대 경로)
dir = "data/recordings"
# 업로드가 끝난 녹화 중 로컬에 남길 최신 개수. 나머지는 GCS에만 남긴다.
keep_local_count = 5
# GCS 온디맨드 복원 캐시(`.cache/`) 상한
keep_cache_count = 3
# 이 시간(초) 동안 패킷이 없으면 녹화를 마감한다(기본 10분).
# 같은 세션이 다시 시작되면 segment를 늘려(`2부`) 새 파일로 이어 받는다.
inactivity_timeout_s = 600
# 데모 세션(f1re-demo)은 자동 녹화·백업하지 않는다.
exclude_demo = true
# 이보다 적은 패킷의 세션(메뉴만 열었다 닫은 경우 등)은 백업하지 않고 폐기한다.
min_packets = 100

[recording.gcs]
enabled = true
# rclone 원격 이름과 버킷(`<remote>:<bucket>/<prefix>/...`로 업로드)
# 실제 경로: gcs:f1-race-engineer/telemetry-raw/<세션 종류>/<시작시각>_t<서킷>_<UID>_s<회차>.f1rec.zst
# 같은 버킷의 ltx/ 는 Litestream(DB 복제) 몫이라 prefix를 겹치지 않게 둔다.
rclone_remote = "gcs"
bucket = "f1-race-engineer"
prefix = "telemetry-raw"
# rclone 설정 파일. 홈서버 계정 기준 경로다.
rclone_config = "~/.config/rclone/rclone.conf"
